name: Publish namespace archive

# Produces a dated full-namespace archive by rehydrating the last published one
# from S3, applying the update delta, and republishing. Stateless: nothing
# persists between runs except the tar in the bucket.
#

on:
  schedule:
    # Quarterly, 14:00 UTC on the 1st of Jan/Apr/Jul/Oct. Late enough in the day
    # that the daily queuer (10:00) and the checkers (11:40-13:35) have already
    # brought PEPhub current, so the snapshot includes that morning's additions.
    - cron: '0 14 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Namespace to archive'
        required: true
        default: 'geo'
        type: string
      start_period:
        description: "Delta start (YYYY/MM/DD). Blank = previous archive's date. Use 2024/09/06 for the backfill run"
        required: false
        default: ''
        type: string
      register:
        description: 'Publish to S3 and write the archive row. Leave unchecked for a dry run'
        required: true
        default: false
        type: boolean
      workers:
        description: 'Concurrent project fetches'
        required: true
        default: '4'
        type: string
      fail_threshold:
        description: 'Abort without publishing if this fraction of fetches fail'
        required: true
        default: '0.01'
        type: string

jobs:
  archive:
    runs-on: ${{ matrix.os }}
    # Under the 360-minute hard cap so a hang fails cleanly rather than being
    # killed mid-upload. Backfill of ~41k projects measured well under this.
    timeout-minutes: 330
    strategy:
      matrix:
        python-version: [ "3.12" ]
        os: [ ubuntu-latest ]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Disk before
        run: df -h ${{ runner.temp }} /

      - name: Build and publish archive
        run: |
          ARGS=(
            --namespace "$NAMESPACE"
            --workdir "$RUNNER_TEMP/archive"
            --workers "$WORKERS"
            --fail-threshold "$FAIL_THRESHOLD"
          )
          [ -n "$START_PERIOD" ] && ARGS+=(--start-period "$START_PERIOD")
          if [ "$REGISTER" = "true" ]; then
            ARGS+=(--register)
          else
            ARGS+=(--no-register)
          fi
          geopephub archive-update "${ARGS[@]}"
        env:
          # On a scheduled run the inputs context is empty, so every value needs
          # a fallback. Without them the job would run with a blank namespace and,
          # worse, silently skip publishing.
          NAMESPACE: ${{ inputs.namespace || 'geo' }}
          START_PERIOD: ${{ inputs.start_period }}
          WORKERS: ${{ inputs.workers || '4' }}
          FAIL_THRESHOLD: ${{ inputs.fail_threshold || '0.01' }}
          REGISTER: ${{ github.event_name == 'schedule' && 'true' || inputs.register }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}

      - name: Disk after
        if: always()
        run: df -h ${{ runner.temp }} /
